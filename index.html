<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ананасовый улун — Teaboom</title>
    <meta
      name="description"
      content="Карточка товара Ананасовый улун для тестового задания по HTML-верстке."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="product-card" aria-label="Карточка товара Ананасовый улун">
        <div class="product-gallery">
          <div class="product-badge">Популярный выбор</div>
          <img
            src="https://images.unsplash.com/photo-1515823064-d6e0c04616a7?auto=format&fit=crop&w=900&q=80"
            alt="Ананасовый улун"
          />
        </div>

        <div class="product-info">
          <div class="product-meta">
            <p class="product-category">Чай</p>
            <h1 class="product-title">Ананасовый улун</h1>
          </div>

          <div class="product-pack-selector" aria-label="Выбор фасовки">
            <p class="selector-label">Фасовка</p>
            <div class="pack-list" role="listbox" aria-label="Фасовки товара">
              <button type="button" class="pack-option is-active" data-pack="100" data-article="01306" data-price="326.40" data-old-price="349.20" aria-pressed="true">
                <span class="pack-weight">100 г</span>
              </button>
              <button type="button" class="pack-option" data-pack="500" data-article="01307" data-price="1432" data-old-price="1646" aria-pressed="false">
                <span class="pack-weight">500 г</span>
              </button>
              <button type="button" class="pack-option" data-pack="1000" data-article="01308" data-price="2064" data-old-price="2592" aria-pressed="false">
                <span class="pack-weight">1000 г</span>
              </button>
              <button type="button" class="pack-option" data-pack="5000" data-article="01309" data-price="6320" data-old-price="8710" aria-pressed="false">
                <span class="pack-weight">5000 г</span>
              </button>
            </div>
          </div>

          <div class="product-article-row">
            <span class="label">Артикул</span>
            <span class="product-article" id="productArticle">01306</span>
          </div>

          <div class="product-price-block" aria-live="polite">
            <div class="price-stack">
              <span class="price-current" id="currentPrice">326,40 ₽</span>
              <span class="price-old" id="oldPrice">349,20 ₽</span>
            </div>
            <button class="add-to-cart" type="button">В корзину</button>
          </div>

          <div class="product-description">
            <h2>Коротко о продукте</h2>
            <p>
              Ананасовый улун сочетает в себе мягкий вкус чая с лёгкой тропической
              кислинкой и ароматом спелого ананаса. Напиток получается ярким,
              освежающим и очень комфортным в любом времени дня.
            </p>
          </div>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
